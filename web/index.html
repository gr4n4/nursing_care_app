<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="식사 · 수분 · 배설 통합 관리">
  <meta name="theme-color" content="#16305E">
  <meta name="application-name" content="NRCarec">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NRCarec">
  <!-- iOS 홈화면 아이콘.
       iOS는 이 파일을 URL 기준으로 캐시해, 이름이 같으면 내용이 바뀌어도
       옛 그림을 계속 쓴다. 그래서 새 이름으로 둔다.
       크기도 iOS가 실제로 찾는 값(아이폰 180, 아이패드 167/152)을 준다. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-152.png">

  <!-- Favicon -->
  <!-- 탭 아이콘. 16px만 주면 브라우저가 그걸 늘려 써서 뭉개진다.
       크기별로 주면 각자 가장 알맞은 것을 고른다. -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png"/>

  <title>NRCarec</title>
  <link rel="manifest" href="manifest.json">

  <!-- 엔진(skwasm)과 Firebase SDK를 www.gstatic.com 에서 받아온다.
       미리 연결해 두면 DNS·TLS 왕복을 앱 코드 받는 동안 미리 끝낸다. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <!-- 앱 진입 모듈. flutter_bootstrap.js 가 파싱된 뒤에야 요청되던 것을
       문서 파싱 시점부터 받기 시작한다.
       (main.dart.wasm 은 일부러 넣지 않는다. fetch 프리로드는 자격증명 모드가
        어긋나면 같은 파일을 두 번 받아 오히려 손해다.) -->
  <link rel="modulepreload" href="main.dart.mjs">

  <style>
    /* 시작 화면.
       이게 없으면 엔진과 앱 코드를 받는 2~4초 동안 흰 화면만 보인다.
       실제로 느린 것보다 "아무것도 안 뜨는" 것이 훨씬 느리게 느껴진다. */
    html, body { margin: 0; padding: 0; height: 100%; background: #16305E; }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #16305E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      transition: opacity .28s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }

    #splash img {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      /* 로고가 뜨기 전 깜빡임을 막는다. */
      background: rgba(255, 255, 255, .06);
    }

    #splash .name {
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    #splash .bar {
      width: 132px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .18);
      overflow: hidden;
    }
    #splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: #fff;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }
    /* 움직임을 줄여 달라는 설정을 존중한다. */
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; opacity: .5; }
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">NRCarec</div>
    <div class="bar"></div>
  </div>

  <script>
    // 플러터가 첫 화면을 그리면 시작 화면을 걷는다.
    // 시간으로 짐작하지 않고 실제로 뷰가 붙는 것을 보고 지운다.
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;

      var removed = false;
      function remove() {
        if (removed) return;
        removed = true;
        observer.disconnect();
        clearTimeout(failsafe);
        splash.classList.add('done');
        setTimeout(function () { splash.remove(); }, 320);
      }

      function ready() {
        return document.querySelector('flutter-view, flt-glass-pane') !== null;
      }

      var observer = new MutationObserver(function () {
        // 뷰가 붙자마자가 아니라 한 프레임 뒤에 지워야 흰 깜빡임이 없다.
        if (ready()) requestAnimationFrame(function () {
          requestAnimationFrame(remove);
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 엔진이 끝내 뜨지 않아도 화면이 갇히면 안 된다.
      var failsafe = setTimeout(remove, 20000);

      if (ready()) remove();
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
