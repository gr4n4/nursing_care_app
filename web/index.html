<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="식사 · 수분 · 배설 통합 관리">
  <meta name="theme-color" content="#16305E">
  <meta name="application-name" content="NRCarec">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NRCarec">
  <!-- iOS 홈화면 아이콘.
       iOS는 이 파일을 URL 기준으로 캐시해, 이름이 같으면 내용이 바뀌어도
       옛 그림을 계속 쓴다. 그래서 새 이름으로 둔다.
       크기도 iOS가 실제로 찾는 값(아이폰 180, 아이패드 167/152)을 준다. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-152.png">

  <!-- Favicon -->
  <!-- 탭 아이콘. 16px만 주면 브라우저가 그걸 늘려 써서 뭉개진다.
       크기별로 주면 각자 가장 알맞은 것을 고른다. -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png"/>

  <title>NRCarec</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
